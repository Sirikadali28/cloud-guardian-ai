name: Cloud Guardian CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda/requirements.txt
          pip install pytest pytest-cov flake8 black
      
      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 lambda/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 lambda/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
      
      - name: Check code formatting with black
        run: black --check lambda/ tests/ || true
      
      - name: Run unit tests with pytest
        run: |
          pytest tests/ -v --cov=lambda --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage.xml

  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      
      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check -recursive
      
      - name: Terraform Validate
        run: terraform -chdir=terraform validate
      
      - name: TFLint
        uses: terraform-linters/setup-tflint@v3
      
      - name: Run TFLint
        run: |
          cd terraform
          tflint --init
          tflint

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [validate, terraform, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Create deployment artifact
        run: |
          mkdir -p build
          cp -r lambda/ build/
          cp -r terraform/ build/
          zip -r cloud-guardian-ai.zip build/
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: cloud-guardian-ai-build
          path: cloud-guardian-ai.zip
          retention-days: 30

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [validate, terraform, security]
    if: always()
    
    steps:
      - name: Job Status
        run: |
          if [ "${{ needs.validate.result }}" == "failure" ] || \
             [ "${{ needs.terraform.result }}" == "failure" ] || \
             [ "${{ needs.security.result }}" == "failure" ]; then
            echo "❌ Pipeline failed"
            exit 1
          else
            echo "✅ All checks passed!"
          fi
